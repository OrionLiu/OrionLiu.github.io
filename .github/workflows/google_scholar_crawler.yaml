name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Reqs
        run: |
          sudo apt-get install python3-setuptools
      - name: Run
        run: |
          cd ./google_scholar_crawler
          python3 -m pip install --user -r requirements.txt
          python3 main.py
          if [ -f ./results/gs_data.json ]; then
            cd ./results
            git init
            git config --local user.name "${GITHUB_ACTOR}"
            export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
            git add *.json
            git commit -m "Updated Citation Data"
            git push "${remote_repo}" HEAD:google-scholar-stats --force
            # Refresh the jsDelivr CDN cache so the site shows the new numbers right away
            curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@google-scholar-stats/gs_data.json" > /dev/null || true
            curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@google-scholar-stats/gs_data_shieldsio.json" > /dev/null || true
          else
            echo "No new citation data scraped; keeping last good data on google-scholar-stats."
          fi
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
